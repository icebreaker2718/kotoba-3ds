# Builds Kotoba3DS.3gx and dict.bin on GitHub's servers.
# Every push to main also publishes both files as the "latest" release, so they can be
# downloaded without a GitHub login.
name: build

on:
  push:
  workflow_dispatch:

jobs:
  plugin:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CTRPluginFramework + 3gxtool
        run: bash .github/workflows/install-ctrpf.sh

      - name: Build plugin
        run: |
          export PATH="$DEVKITPRO/tools/bin:$PATH"
          if ! make -C plugin > build.log 2>&1; then
            cat build.log
            echo "::error title=plugin build::$(grep -m5 -E 'error|Error' build.log | tr '\n' ' ' | tail -c 1500)"
            exit 1
          fi
          cat build.log

      - name: Symbolize crash addresses
        if: hashFiles('.github/crash-addresses.txt') != ''
        continue-on-error: true
        shell: bash
        run: |
          export PATH="$DEVKITPRO/devkitARM/bin:$PATH"
          ELF=plugin/Kotoba3DS.elf
          ls -la plugin/*.elf || echo "::warning::no elf"
          arm-none-eabi-nm -C -n "$ELF" | grep -i ' [tw] ' > syms.txt
          for a in $(grep -v '^#' .github/crash-addresses.txt); do
            A=$((a)); best=""
            while read -r addr typ name; do
              v=$((16#$addr)); [ $v -le $A ] && best="$name (+$((A - v)))" || break
            done < syms.txt
            f=$(arm-none-eabi-addr2line -f -C -e "$ELF" "$a" | head -1)
            echo "::notice title=$a::$best | addr2line: $f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Kotoba3DS-plugin
          path: plugin/Kotoba3DS.3gx

  dictionary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get Jitendex + RADKFILE
        run: |
          pip install jamdict jamdict-data pyftpdlib pillow
          curl -fsSL -o jitendex-yomitan.zip \
            https://github.com/stephenmk/stephenmk.github.io/releases/latest/download/jitendex-yomitan.zip \
            || rm -f jitendex-yomitan.zip
          # JPDB's frequency ranks (anime, VNs, games, novels), from Kuuuube's Yomitan dictionaries
          curl -fsSL -o jpdb-freq.zip \
            https://github.com/Kuuuube/yomitan-dictionaries/raw/main/dictionaries/JPDB_v2.2_Frequency_Kana_2024-10-13.zip \
            || rm -f jpdb-freq.zip

      - name: Build dict.bin
        run: |
          FREQ=""
          if [ -s jpdb-freq.zip ]; then FREQ="--freq jpdb-freq.zip"
          else echo "::warning title=JPDB::frequency list download failed, building without ranks"; fi
          if [ -s jitendex-yomitan.zip ]; then
            python tools/build_dict.py --yomitan jitendex-yomitan.zip $FREQ -o dict.bin
          else
            echo "::warning title=Jitendex::download failed, building from the bundled JMdict instead"
            python tools/build_dict.py $FREQ -o dict.bin
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Kotoba3DS-dict
          path: dict.bin

      - name: Install Japanese fonts (for the on-device OCR tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk fonts-misaki

      - name: Get the on-device OCR models (VOCR6 Normal + the textspot8 line spotter, from bee-san/vita-vn-ocr)
        run: |
          d=ocrpkg/3ds/kotoba3ds/ocr
          mkdir -p $d vocr5
          base=https://github.com/bee-san/vita-vn-ocr/releases/download/v0.5.0
          for f in VOCR6.2_N_w8g2.vocr MODEL_CARD_VOCR6.2_N.md VOCR6-ATTRIBUTION.md \
                   textspot8_t64n8c16_w8.vtsp MODEL_CARD_TEXTSPOT8.md SPOTTER-ATTRIBUTION.md; do
            curl -fsSL --retry 3 -o $d/$f $base/$f
          done
          (cd $d && sha256sum -c - <<'EOF'
          107cf084cc0c1a3a61ce4c3f9b9cf6b31d6dff80f0a1bdb94afd3f7ee9ae3bc9  VOCR6.2_N_w8g2.vocr
          e129d41adfa02c658a7d13d6f98064e6ab6ce9a2bc8c7a56da700a21357b5e1c  textspot8_t64n8c16_w8.vtsp
          EOF
          )
          cat > $d/README.txt <<'EOF'
          On-device OCR models for Kotoba3DS, from https://github.com/bee-san/vita-vn-ocr (release
          v0.5.0), unchanged: VOCR6 Normal (VOCR6.2_N_w8g2.vocr), the recognizer, and textspot8
          (textspot8_t64n8c16_w8.vtsp), which finds the lines of text on the screen. The code is
          GPL-3.0-or-later; the weights are for NON-COMMERCIAL use only (see VOCR6-ATTRIBUTION.md,
          SPOTTER-ATTRIBUTION.md and the model cards).
          Copy the "3ds" folder to the root of the SD card: the files go to /3ds/kotoba3ds/ocr/.
          An older VOCR5_N_w8.vocr there can stay or go: VOCR6 is used when both are there.
          EOF
          (cd ocrpkg && zip -qr ../Kotoba3DS-ocr-model.zip 3ds)
          # VOCR5, for the tests only: the plugin still reads with it when VOCR6 isn't on the SD card
          curl -fsSL --retry 3 -o vocr5/VOCR5_N_w8.vocr https://github.com/bee-san/vita-vn-ocr/releases/download/v0.3.0/VOCR5_N_w8.vocr
          test "$(stat -c %s vocr5/VOCR5_N_w8.vocr)" = 1185632

      - uses: actions/upload-artifact@v4
        with:
          name: Kotoba3DS-ocr-model
          path: Kotoba3DS-ocr-model.zip

      - name: Test the plugin core against it
        run: make -C tests run DICT=../dict.bin

      - name: Test on-device OCR on rendered 3DS screens (VOCR6, and VOCR5 as the fallback)
        run: |
          python tests/test_local_ocr.py ocrpkg/3ds/kotoba3ds/ocr/VOCR6.2_N_w8g2.vocr
          python tests/test_local_ocr.py vocr5/VOCR5_N_w8.vocr

      - name: Test on-device OCR built for the 3DS CPU (ARMv6 SIMD kernel, under qemu-arm)
        run: |
          sudo apt-get install -y -q gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf qemu-user
          tests/build_arm_cli.sh
          OCR_PROBE="qemu-arm -cpu cortex-a15 $PWD/tests/ocr_cli_arm" python tests/test_local_ocr.py ocrpkg/3ds/kotoba3ds/ocr/VOCR6.2_N_w8g2.vocr

      - name: Test the memory-call stand-ins on an ARM CPU (under qemu-arm)
        run: tests/build_memhooks_arm.sh

      - name: Test the screenshot converter (compact upload)
        run: python tests/test_bmp.py

      - name: Test text-line detection (furigana removal)
        run: python tests/test_ocrprep.py

      - name: Test the plugin's network code against the OCR server
        run: python tests/test_ocr.py dict.bin

      - name: Test the audio fallbacks
        run: python tests/test_audio.py

      - name: Test the Anki card script
        run: |
          if [ -s jitendex-yomitan.zip ]; then python tests/test_mine.py jitendex-yomitan.zip
          else python tests/test_mine.py; fi

  release:
    # Publishes the two files as a GitHub Release (downloadable without logging in).
    needs: [plugin, dictionary]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la out
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest out/Kotoba3DS.3gx out/dict.bin out/Kotoba3DS-ocr-model.zip \
            --target "$GITHUB_SHA" --latest \
            --title "Kotoba3DS (latest build)" \
            --notes "Built automatically from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d).

          1. Copy **Kotoba3DS.3gx** to your SD card as \`/luma/plugins/default.3gx\` (every game), or \`/luma/plugins/<TitleID>/Kotoba3DS.3gx\` for one game.
          2. Copy **dict.bin** to \`/3ds/kotoba3ds/dict.bin\`.
          3. Unzip **Kotoba3DS-ocr-model.zip** to the root of the SD card (the on-device OCR models: VOCR6 and the textspot8 line spotter, [by bee-san/vita-vn-ocr](https://github.com/bee-san/vita-vn-ocr), for non-commercial use only).

          See the README for the PC tools (OCR server, Anki cards)."

  alpha-release:
    # The alpha branch's plugin as a development pre-release ("alpha-dev"), so the console build can be
    # fetched through the REST API and put on the owner's SD card (the owner's OK, 2026-10-28). Not for testers.
    needs: [plugin]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/alpha'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Kotoba3DS-plugin
          path: out
      - name: Publish the "alpha-dev" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete alpha-dev --yes --cleanup-tag 2>/dev/null || true
          gh release create alpha-dev out/Kotoba3DS.3gx --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "DEVELOPMENT ONLY - do not use (alpha, experimental)" \
            --notes "NOT FOR TESTERS OR PLAYERS. This is the developer's experimental alpha build (${GITHUB_SHA::7}, $(date -u +%Y-%m-%d)), published only so it can be copied onto the developer's own SD card. It may crash, run slowly (it benchmarks every reader on each read) or need files that aren't in any release. For trying new features use the \"Kotoba3DS test build\" pre-release; for normal use, the latest release."

  test-release:
    # The test branch's plugin and OCR models as a pre-release ("test"), for trying on the console before main.
    needs: [plugin, dictionary]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: TEST-BUILD.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: Kotoba3DS-plugin
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: Kotoba3DS-ocr-model
          path: out
      - name: Publish the "test" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete test-build --yes --cleanup-tag 2>/dev/null || true
          # the notes: the build's commit, then TEST-BUILD.md (what's new, installing, reporting problems)
          { echo "Built from the test branch (${GITHUB_SHA::7}, $(date -u +%Y-%m-%d)). The dictionary (dict.bin) is the latest release's."
            echo; sed '1{/^# /d}' TEST-BUILD.md; } > notes.md
          gh release create test-build out/Kotoba3DS.3gx out/Kotoba3DS-ocr-model.zip --target "$GITHUB_SHA" --prerelease \
            --title "Kotoba3DS test build" --notes-file notes.md
