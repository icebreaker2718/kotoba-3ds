# Builds Kotoba3DS.3gx and dict.bin on GitHub's servers.
# Every push to main also publishes both files as the "latest" release, so they can be
# downloaded without a GitHub login.
name: build

on:
  push:
  workflow_dispatch:

jobs:
  plugin:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CTRPluginFramework + 3gxtool
        run: bash .github/workflows/install-ctrpf.sh

      - name: Build plugin
        run: |
          export PATH="$DEVKITPRO/tools/bin:$PATH"
          if ! make -C plugin > build.log 2>&1; then
            cat build.log
            echo "::error title=plugin build::$(grep -m5 -E 'error|Error' build.log | tr '\n' ' ' | tail -c 1500)"
            exit 1
          fi
          cat build.log

      - name: Build a test copy that asks Luma for 2 MiB instead of 5 (games short of memory)
        run: |
          export PATH="$DEVKITPRO/tools/bin:$PATH"
          sed 's/^MemorySize: .*/MemorySize: 2MiB/' plugin/Kotoba3DS.plgInfo > plugin/test2mib.plgInfo
          3gxtool -s plugin/Kotoba3DS.elf plugin/test2mib.plgInfo plugin/Kotoba3DS-2MiB-test.3gx
          ls -la plugin/*.3gx

      - name: Symbolize crash addresses
        if: hashFiles('.github/crash-addresses.txt') != ''
        continue-on-error: true
        shell: bash
        run: |
          export PATH="$DEVKITPRO/devkitARM/bin:$PATH"
          ELF=plugin/Kotoba3DS.elf
          ls -la plugin/*.elf || echo "::warning::no elf"
          arm-none-eabi-nm -C -n "$ELF" | grep -i ' [tw] ' > syms.txt
          for a in $(grep -v '^#' .github/crash-addresses.txt); do
            A=$((a)); best=""
            while read -r addr typ name; do
              v=$((16#$addr)); [ $v -le $A ] && best="$name (+$((A - v)))" || break
            done < syms.txt
            f=$(arm-none-eabi-addr2line -f -C -e "$ELF" "$a" | head -1)
            echo "::notice title=$a::$best | addr2line: $f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Kotoba3DS-plugin
          path: |
            plugin/Kotoba3DS.3gx
            plugin/Kotoba3DS-2MiB-test.3gx

  dictionary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get Jitendex + RADKFILE
        run: |
          pip install jamdict jamdict-data pyftpdlib pillow
          curl -fsSL -o jitendex-yomitan.zip \
            https://github.com/stephenmk/stephenmk.github.io/releases/latest/download/jitendex-yomitan.zip \
            || rm -f jitendex-yomitan.zip

      - name: Build dict.bin
        run: |
          if [ -s jitendex-yomitan.zip ]; then
            python tools/build_dict.py --yomitan jitendex-yomitan.zip -o dict.bin
          else
            echo "::warning title=Jitendex::download failed, building from the bundled JMdict instead"
            python tools/build_dict.py -o dict.bin
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Kotoba3DS-dict
          path: dict.bin

      - name: Install Japanese fonts (for the on-device OCR tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk fonts-misaki

      - name: Get the on-device OCR model (VOCR5 Normal, from bee-san/vita-vn-ocr)
        run: |
          mkdir -p ocrpkg/3ds/kotoba3ds/ocr
          base=https://github.com/bee-san/vita-vn-ocr/releases/download/v0.3.0
          for f in VOCR5_N_w8.vocr MODEL_CARD_VOCR5_N.md ATTRIBUTION.md; do
            curl -fsSL --retry 3 -o ocrpkg/3ds/kotoba3ds/ocr/$f $base/$f
          done
          test "$(stat -c %s ocrpkg/3ds/kotoba3ds/ocr/VOCR5_N_w8.vocr)" = 1185632
          cat > ocrpkg/3ds/kotoba3ds/ocr/README.txt <<'EOF'
          On-device OCR model for Kotoba3DS: VOCR5 Normal from https://github.com/bee-san/vita-vn-ocr
          (release v0.3.0), unchanged. The code is GPL-3.0-or-later; the weights are for
          NON-COMMERCIAL use only (see ATTRIBUTION.md and MODEL_CARD_VOCR5_N.md).
          Copy the "3ds" folder to the root of the SD card: the model goes to /3ds/kotoba3ds/ocr/.
          EOF
          (cd ocrpkg && zip -qr ../Kotoba3DS-ocr-model.zip 3ds)

      - uses: actions/upload-artifact@v4
        with:
          name: Kotoba3DS-ocr-model
          path: Kotoba3DS-ocr-model.zip

      - name: Test the plugin core against it
        run: make -C tests run DICT=../dict.bin

      - name: Test on-device OCR on rendered 3DS screens
        run: python tests/test_local_ocr.py ocrpkg/3ds/kotoba3ds/ocr/VOCR5_N_w8.vocr

      - name: Test on-device OCR built for the 3DS CPU (ARMv6 SIMD kernel, under qemu-arm)
        run: |
          sudo apt-get install -y -q gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf qemu-user
          tests/build_arm_cli.sh
          OCR_PROBE="qemu-arm -cpu cortex-a15 $PWD/tests/ocr_cli_arm" python tests/test_local_ocr.py ocrpkg/3ds/kotoba3ds/ocr/VOCR5_N_w8.vocr

      - name: Test the screenshot converter (compact upload)
        run: python tests/test_bmp.py

      - name: Test text-line detection (furigana removal)
        run: python tests/test_ocrprep.py

      - name: Test the plugin's network code against the OCR server
        run: python tests/test_ocr.py dict.bin

      - name: Test the audio fallbacks
        run: python tests/test_audio.py

      - name: Test the Anki card script
        run: |
          if [ -s jitendex-yomitan.zip ]; then python tests/test_mine.py jitendex-yomitan.zip
          else python tests/test_mine.py; fi

  release:
    # Publishes the two files as a GitHub Release (downloadable without logging in).
    needs: [plugin, dictionary]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la out
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest out/Kotoba3DS.3gx out/dict.bin out/Kotoba3DS-ocr-model.zip out/Kotoba3DS-2MiB-test.3gx \
            --target "$GITHUB_SHA" --latest \
            --title "Kotoba3DS (latest build)" \
            --notes "Built automatically from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d).

          1. Copy **Kotoba3DS.3gx** to your SD card as \`/luma/plugins/default.3gx\` (every game), or \`/luma/plugins/<TitleID>/Kotoba3DS.3gx\` for one game.
          2. Copy **dict.bin** to \`/3ds/kotoba3ds/dict.bin\`.
          3. Unzip **Kotoba3DS-ocr-model.zip** to the root of the SD card (the on-device OCR model). The model is [VOCR5 by bee-san/vita-vn-ocr](https://github.com/bee-san/vita-vn-ocr), for non-commercial use only.

          **Kotoba3DS-2MiB-test.3gx** is a test copy for games that crash at start with the plugin: it asks Luma for 2 MiB of the game's memory instead of 5. Reading the screen doesn't fit in 2 MiB, so it only shows whether the game starts.

          See the README for the PC tools (OCR server, Anki cards)."
